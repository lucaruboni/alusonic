# Rate-limit zones
limit_req_zone $binary_remote_addr zone=wp_auth_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=wp_ajax_limit:10m rate=60r/m;

# Block ?author= username enumeration (OWASP A01)
map $args $tsb_author_scan {
    default  0;
    ~*"author=[0-9]"  1;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    client_max_body_size 64m;

    # ── Security headers (OWASP A05) ────────────────────────────────────────
    # HSTS: 2-year max-age, preload-ready
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    # CSP: no unsafe-eval (OWASP A03), object-src none, base-uri/form-action self
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://*.iubenda.com; style-src 'self' 'unsafe-inline' https://*.iubenda.com; img-src 'self' https: data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://*.iubenda.com; frame-src 'self' https://www.google.com https://maps.google.com https://maps.googleapis.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self';" always;

    # ── Block author scan (OWASP A01) ───────────────────────────────────────
    if ($tsb_author_scan) { return 403; }

    # ── ACME challenge ───────────────────────────────────────────────────────
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ── Block information-disclosure files (OWASP A05) ─────────────────────
    location ~* ^/(readme\.html|license\.txt|wp-config-sample\.php)$ {
        return 403;
    }

    # ── Block dot-files (OWASP A05) ─────────────────────────────────────────
    location ~ /\. {
        deny all;
        return 403;
    }

    # ── Block XML-RPC (OWASP A01 / DDoS amplification) ──────────────────────
    location = /xmlrpc.php {
        deny all;
        return 403;
    }

    # ── Block Polylang REST namespace for unauthenticated visitors (OWASP A01)
    # Exposes internal term IDs, flag paths, page_on_front IDs, locale details.
    # Authenticated admin calls are passed through (handled by WP auth check).
    location ^~ /wp-json/pll/ {
        return 403;
    }

    # ── Block direct PHP execution inside theme include dirs (OWASP A05) ─────
    # Prevents scripts like inc/polylang-setup.php being run via browser.
    location ~* /wp-content/themes/[^/]+/inc/[^/]+\.php {
        return 403;
    }

    # ── Block translation file enumeration (OWASP A05) ───────────────────────
    # .po files reveal the full site string inventory; .mo are binary equivalents.
    location ~* /wp-content/themes/[^/]+/languages/[^/]+\.(po|mo)$ {
        return 403;
    }

    # ── Rate-limit login — brute-force protection (OWASP A07) ───────────────
    location = /wp-login.php {
        limit_req zone=wp_auth_limit burst=5 nodelay;
        proxy_pass http://wordpress:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Rate-limit AJAX — prevents contact-form spam / DoS (OWASP A04) ──────
    location = /wp-admin/admin-ajax.php {
        limit_req zone=wp_ajax_limit burst=30 nodelay;
        proxy_pass http://wordpress:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── wp-admin: needs unsafe-eval for WP Backbone/Underscore templates ────
    location /wp-admin/ {
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.iubenda.com; style-src 'self' 'unsafe-inline' https://*.iubenda.com; img-src 'self' https: data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://*.iubenda.com; frame-src 'self' https://www.google.com https://maps.google.com https://maps.googleapis.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self';" always;
        proxy_pass http://wordpress:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Default proxy ────────────────────────────────────────────────────────
    location / {
        proxy_pass http://wordpress:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
