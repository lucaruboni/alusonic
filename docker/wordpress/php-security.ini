expose_php = Off
allow_url_fopen = Off
allow_url_include = Off
display_errors = Off
log_errors = On

; Session hardening — OWASP A07 (Identification and Authentication Failures)
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
session.use_only_cookies = 1
session.gc_maxlifetime = 1800

; Limit input variables to reduce hash-flood DoS — OWASP A04
max_input_vars = 3000
