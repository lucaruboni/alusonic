<IfModule mod_headers.c>
    # OWASP A05 — Security Misconfiguration: full defensive header set
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()"
    Header always set X-Permitted-Cross-Domain-Policies "none"

    # CSP: removed 'unsafe-eval' (prevents eval-based XSS — OWASP A03)
    # 'unsafe-inline' retained for WordPress admin compatibility.
    # frame-src allows Google Maps iframes; connect-src + script-src cover Iubenda.
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://*.iubenda.com; style-src 'self' 'unsafe-inline' https://*.iubenda.com; img-src 'self' https: data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://*.iubenda.com; frame-src 'self' https://www.google.com https://maps.google.com https://maps.googleapis.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self';"

    # Remove server version fingerprinting
    Header always unset X-Powered-By
    Header always unset Server
</IfModule>

# ── Block Polylang REST namespace for public visitors (OWASP A01) ────────────
# Exposes internal term IDs, flag paths and page_on_front IDs to anonymous users.
<LocationMatch "^/wp-json/pll/">
    Require all denied
</LocationMatch>

# ── Block direct PHP execution inside theme include dirs (OWASP A05) ─────────
# Prevents scripts like inc/polylang-setup.php from running via browser.
<LocationMatch "/wp-content/themes/[^/]+/inc/[^/]+\.php$">
    Require all denied
</LocationMatch>

# ── Block translation file enumeration (OWASP A05) ───────────────────────────
# .po files reveal the full site string inventory; .mo are binary equivalents.
<LocationMatch "/wp-content/themes/[^/]+/languages/[^/]+\.(po|mo)$">
    Require all denied
</LocationMatch>

# ── wp-admin: needs unsafe-eval for WP Backbone/Underscore templates ────────
# (Pods, Media uploader, etc. use new Function() via Underscore.js templating)
<Location /wp-admin/>
    <IfModule mod_headers.c>
        Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.iubenda.com; style-src 'self' 'unsafe-inline' https://*.iubenda.com; img-src 'self' https: data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://*.iubenda.com; frame-src 'self' https://www.google.com https://maps.google.com https://maps.googleapis.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self';"
    </IfModule>
</Location>
